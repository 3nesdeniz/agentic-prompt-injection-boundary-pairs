name: Validate dataset

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DUCKDB_VERSION: "1.5.4"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install pinned DuckDB CLI
        run: |
          curl --fail --location --silent --show-error \
            "https://github.com/duckdb/duckdb/releases/download/v${DUCKDB_VERSION}/duckdb_cli-linux-amd64.zip" \
            --output "$RUNNER_TEMP/duckdb.zip"
          unzip -q "$RUNNER_TEMP/duckdb.zip" -d "$RUNNER_TEMP/duckdb"
          echo "$RUNNER_TEMP/duckdb" >> "$GITHUB_PATH"

      - name: Verify DuckDB version
        run: test "$(duckdb --version | awk '{print $1}')" = "v${DUCKDB_VERSION}"

      - name: Rebuild and validate the dataset
        run: ./scripts/build_all.sh

      - name: Verify deterministic generated files
        run: git diff --exit-code

      - name: Verify published file checksums
        run: sha256sum -c metadata/checksums.sha256
